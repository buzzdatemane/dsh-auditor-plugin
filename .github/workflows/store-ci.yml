name: store

on:
  push:
    paths:
      - 'store/**'
      - '.github/workflows/store-ci.yml'
  pull_request:
    paths:
      - 'store/**'
      - '.github/workflows/store-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: store/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
